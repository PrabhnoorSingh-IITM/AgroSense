<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroSense – Farmer’s Dashboard</title>

  <!-- ✅ Correct Bootstrap Icon Import -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- ✅ Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>

  <!-- ✅ Chart.js for graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- ✅ Stylesheet -->
  <link rel="stylesheet" href="./style.css">
</head>

<body class="light-theme">
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-container">
        <i class="bi bi-leaf logo-icon"></i>
        <h1 class="logo-text">AgroSense</h1>
      </div>
      <div class="header-controls">
        <button id="theme-switcher" class="theme-switcher">
          <i class="bi bi-sun-fill theme-icon"></i>
          <span class="theme-text">Light</span>
        </button>
        <button id="logout-btn" class="theme-switcher">Logout</button>
      </div>
    </header>

    <!-- Main -->
    <main class="main-content">
      <!-- Dashboard -->
      <section id="home-page" class="page active">
        <div class="page-header">
          <h2>Field Dashboard</h2>
          <p>Real-time field conditions</p>
        </div>

        <div class="cards-grid">
          <div id="status-banner" class="status-banner card">
            <div class="status-content">
              <i id="status-icon" class="bi bi-check-circle-fill status-icon"></i>
              <div>
                <h3>Field Health</h3>
                <p id="status-text">Connecting to sensors...</p>
              </div>
            </div>
          </div>

          <div class="metric-card card">
            <div class="metric-header">
              <h3>Soil Moisture</h3>
              <i class="bi bi-droplet metric-icon"></i>
            </div>
            <div id="moisture-val" class="metric-value">--%</div>
          </div>

          <div class="metric-card card">
            <div class="metric-header">
              <h3>Air Humidity</h3>
              <i class="bi bi-wind metric-icon"></i>
            </div>
            <div id="humidity-val" class="metric-value">--%</div>
          </div>

          <div class="metric-card card">
            <div class="metric-header">
              <h3>Air Temperature</h3>
              <i class="bi bi-thermometer metric-icon"></i>
            </div>
            <div id="temp-val" class="metric-value">--°C</div>
          </div>
        </div>

        <div class="graph-container card">
          <h3>Soil Moisture Trend</h3>
          <canvas id="moisture-chart"></canvas>
        </div>
      </section>

      <!-- Settings -->
      <section id="settings-page" class="page">
        <div class="page-header">
          <h2>Settings</h2>
          <p>Account and preferences</p>
        </div>

        <div class="settings-sections">
          <div class="settings-section card">
            <h3>Account Details</h3>
            <div class="setting-item">
              <span class="setting-label">Farm ID</span>
              <span id="farm-id" class="setting-value">--</span>
            </div>
            <div class="setting-item">
              <span class="setting-label">Location</span>
              <span id="farm-location" class="setting-value">--</span>
            </div>
            <div class="setting-item">
              <span class="setting-label">Plan</span>
              <span id="farm-plan" class="setting-value premium">--</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-page="home-page">
        <i class="bi bi-house-door-fill nav-icon"></i>
        <span class="nav-text">Home</span>
      </button>
      <button class="nav-item" data-page="settings-page">
        <i class="bi bi-gear-fill nav-icon"></i>
        <span class="nav-text">Settings</span>
      </button>
    </nav>
  </div>

  <!-- Tractor Easter Egg -->
  <div id="tractor" class="tractor hidden">🚜</div>

  <!-- ✅ Your Custom Scripts -->
  <script src="./auth.js"></script>
  <script src="./script.js"></script>
</body>
</html>

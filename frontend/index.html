<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroSense Dashboard</title>

    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Firebase SDKs (Load BEFORE scripts) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body class="light-theme">
    <div class="app-container">
      <header class="header">
        <div class="logo-container">
          <i class="bi bi-leaf logo-icon"></i>
          <h1 class="logo-text">AgroSense</h1>
        </div>
        <div class="header-controls">
          <button id="logout-btn" class="theme-switcher">Logout</button>
        </div>
      </header>

      <main class="main-content">
        <section id="home-page" class="page active">
          <h2>🌾 Field Dashboard</h2>
          <div class="cards-grid">
            <div class="metric-card card">
              <h3>Soil Moisture</h3>
              <div id="moisture-val">--%</div>
            </div>
            <div class="metric-card card">
              <h3>Humidity</h3>
              <div id="humidity-val">--%</div>
            </div>
            <div class="metric-card card">
              <h3>Temperature</h3>
              <div id="temp-val">--°C</div>
            </div>
          </div>
          <div class="graph-container card">
            <h3>Soil Moisture Trend</h3>
            <canvas id="moisture-chart"></canvas>
          </div>
        </section>
      </main>

      <nav class="bottom-nav">
        <button class="nav-item active" data-page="home-page">
          <i class="bi bi-house-door-fill"></i>
          <span>Home</span>
        </button>
      </nav>
    </div>

    <!-- JS Files -->
    <script src="auth.js"></script>
    <script src="script.js"></script>
  </body>
</html>
